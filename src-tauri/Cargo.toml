[package]
name = "angel-ai-assistant"
version = "0.1.0"
description = "Angel AI Assistant - Real-time transcription and AI-powered meeting helper"
authors = ["Angel Team"]
edition = "2021"
rust-version = "1.60"
publish = false

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = [ "window-maximize", "window-unmaximize", "window-set-fullscreen", "window-set-skip-taskbar", "window-set-position", "window-set-always-on-top", "window-set-focus", "window-close", "notification-all", "window-set-size", "window-set-cursor-visible", "global-shortcut-all", "window-minimize", "window-set-cursor-icon", "window-hide", "window-show", "window-create", "window-set-decorations", "window-set-cursor-grab", "shell-open", "global-shortcut", "notification"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
